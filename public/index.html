<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prompt to Video Director</title>
<style>:root{font-family:Inter,ui-sans-serif,system-ui;color:#eaf4f5;background:#07141c}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 10% 0,#173d48,transparent 35%),#07141c}.shell{max-width:1100px;margin:auto;padding:48px 24px}.eyebrow{color:#66e3c4;text-transform:uppercase;letter-spacing:.16em;font-weight:800;font-size:12px}h1{font-size:clamp(38px,7vw,76px);line-height:.94;max-width:800px;margin:14px 0 18px}.intro{color:#a9c2c7;font-size:18px;max-width:700px}.grid{display:grid;grid-template-columns:1fr .85fr;gap:22px;margin-top:36px}.card{background:#0d222c;border:1px solid #21404a;border-radius:22px;padding:24px;box-shadow:0 24px 60px #0005}label{display:block;font-size:13px;font-weight:750;margin:16px 0 7px}textarea,input,select{width:100%;border:1px solid #34535d;border-radius:12px;background:#081820;color:#fff;padding:13px;font:inherit}textarea{min-height:150px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.check{display:flex;gap:10px;align-items:flex-start;color:#bad0d4;font-weight:500}.check input{width:auto;margin-top:3px}button{width:100%;margin-top:18px;border:0;border-radius:13px;padding:14px 18px;background:#66e3c4;color:#05221c;font-weight:850;font-size:16px;cursor:pointer}button.secondary{background:#193943;color:#dff7f1}button:disabled{opacity:.45}.status{min-height:24px;color:#92aaaf;margin-top:12px}.scene{border-left:3px solid #66e3c4;padding:8px 13px;margin:12px 0;background:#102a34}.scene strong{display:block}.scene span{color:#b9ced2}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#1c3b45;color:#aee9dc;font-size:12px}.empty{color:#78939a;padding:40px 8px;text-align:center}.warning{font-size:12px;color:#e4c889}.download{display:none;text-align:center;text-decoration:none;margin-top:12px;padding:13px;background:#f3cb68;color:#251b02;border-radius:12px;font-weight:800}@media(max-width:800px){.grid{grid-template-columns:1fr}.shell{padding-top:28px}}</style></head>
<body><main class="shell"><div class="eyebrow">Approval-gated video studio</div><h1>Turn one prompt into a reviewable video.</h1><p class="intro">Generate a scene plan, review every line, approve the brief, then render a downloadable MP4. Paid providers and publishing stay off.</p>
<div class="grid"><section class="card"><label for="prompt">Describe your video</label><textarea id="prompt" placeholder="Create a 30-second vertical video explaining how to recognise stroke using FAST."></textarea><div class="row"><div><label for="audience">Audience</label><input id="audience" value="General public"></div><div><label for="duration">Duration</label><select id="duration"><option value="15">15 seconds</option><option value="30" selected>30 seconds</option><option value="45">45 seconds</option><option value="60">60 seconds</option></select></div></div><label for="ratio">Format</label><select id="ratio"><option value="vertical">Vertical 9:16</option><option value="landscape">Landscape 16:9</option></select><label class="check"><input id="useAi" type="checkbox"><span>Use OpenAI director <span class="warning">(requires server key and explicit enablement; may incur API charges)</span></span></label><button id="generate">Generate scene plan</button><div id="status" class="status"></div></section>
<section class="card"><span id="mode" class="badge">Waiting for prompt</span><div id="preview" class="empty">Your scene plan will appear here.</div><label class="check"><input id="approve" type="checkbox" disabled><span>I reviewed and approve this brief for local rendering.</span></label><button id="render" class="secondary" disabled>Render MP4</button><a id="download" class="download">Download video</a></section></div></main>
<script>const $=id=>document.getElementById(id);let job=null;$('generate').onclick=async()=>{try{$('generate').disabled=true;$('status').textContent='Directing scenes…';$('download').style.display='none';const response=await fetch('/api/generate',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({prompt:$('prompt').value,audience:$('audience').value,durationSeconds:Number($('duration').value),aspectRatio:$('ratio').value,useAi:$('useAi').checked})});const data=await response.json();if(!response.ok)throw new Error(data.error);job=data.job;$('mode').textContent=data.mode==='openai'?'OpenAI structured director':'Demo director — no API cost';$('preview').innerHTML='<h2>'+esc(job.title)+'</h2>'+job.scenes.map(s=>'<div class="scene"><strong>'+esc(s.heading)+'</strong><span>'+esc(s.body)+'</span></div>').join('');$('approve').disabled=false;$('approve').checked=false;$('render').disabled=true;$('status').textContent='Review the plan before approving.'}catch(e){$('status').textContent=e.message}finally{$('generate').disabled=false}};$('approve').onchange=()=>{if(!job)return;job.approvals.brief=$('approve').checked?'approved':'pending';$('render').disabled=!$('approve').checked};$('render').onclick=async()=>{try{$('render').disabled=true;$('status').textContent='Rendering MP4… this may take a few minutes.';const response=await fetch('/api/render',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(job)});const data=await response.json();if(!response.ok)throw new Error(data.error);$('download').href=data.downloadUrl;$('download').style.display='block';$('status').textContent='Video ready.'}catch(e){$('status').textContent=e.message;$('render').disabled=false}};function esc(v){return String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}</script></body></html>
